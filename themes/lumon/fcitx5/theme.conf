[Metadata]
Name=Fcitx5 Theme Template
Version=1.0
Author=justTOBBI, Isabelinc, Kurome, Luke Hogan
Description=Use this template to create new theme
ScaleWithDPI=True

# #d6e2ee: Text and icons
# #16242d: Background and selected text
# #4d9ed3: Highlights and border

[InputPanel]
