# Menus
bindd = $CMD, SPACE, Launch apps, exec, omarchy-launch-walker
bindd = $CMD CTRL, E, Emoji picker, exec, omarchy-launch-walker -m symbols
bindd = $CMD CTRL, C, Capture menu, exec, omarchy-menu capture
bindd = $CMD CTRL, O, Toggle menu, exec, omarchy-menu toggle
bindd = $CMD ALT, SPACE, Omarchy menu, exec, omarchy-menu
bindd = , MENU, Omarchy menu, exec, omarchy-menu
bindd = $CMD, ESCAPE, System menu, exec, omarchy-menu system
bindld = , XF86PowerOff, Power menu, exec, omarchy-menu system
bindd = $CMD, SEMICOLON, Show key bindings, exec, omarchy-menu-keybindings # alternatively, Command+Shift+K ?

# Aesthetics
bindd = $CMD SHIFT, SPACE, Toggle top bar, exec, omarchy-toggle-waybar
bindd = $CMD CTRL, SPACE, Theme background menu, exec, omarchy-menu background
bindd = $CMD SHIFT CTRL, SPACE, Theme menu, exec, omarchy-menu theme
bindd = $CMD, BACKSPACE, Toggle window transparency, exec, omarchy-hyprland-window-transparency-toggle
bindd = $CMD SHIFT, BACKSPACE, Toggle workspace gaps, exec, omarchy-hyprland-workspace-toggle-gaps
bindd = $CMD CTRL, BACKSPACE, Toggle single-window square aspect, exec, omarchy-hyprland-window-single-square-aspect-toggle

# Notifications
bindd = $CMD, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = $CMD SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = $CMD CTRL, COMMA, Toggle silencing notifications, exec, omarchy-toggle-notification-silencing
bindd = $CMD ALT, COMMA, Invoke last notification, exec, makoctl invoke
bindd = $CMD SHIFT ALT, COMMA, Invoke last notification, exec, makoctl restore

# Toggles
bindd = $CMD CTRL, I, Toggle locking on idle, exec, omarchy-toggle-idle
bindd = $CMD CTRL, N, Toggle nightlight, exec, omarchy-toggle-nightlight

# Captures
bindd = , PRINT, Screenshot, exec, omarchy-cmd-screenshot
bindd = ALT, PRINT, Screenrecording, exec, omarchy-menu screenrecord
bindd = $CMD, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a

# File sharing
bindd = $CMD CTRL, S, Share, exec, omarchy-menu share

# Transcoding
bindd = $CMD CTRL, PERIOD, Transcode, exec, omarchy-transcode

# Reminders
bindd = $CMD CTRL, R, Set reminder, exec, omarchy-menu reminder-set
bindd = $CMD CTRL ALT, R, Show reminders, exec, omarchy-reminder show
bindd = $CMD SHIFT CTRL, R, Clear reminders, exec, omarchy-reminder clear

# Waybar-less information
bindd = $CMD CTRL ALT, T, Show time, exec, notify-send "    $(date +"%A %H:%M  —  %d %B W%V %Y")"
bindd = $CMD CTRL ALT, B, Show battery remaining, exec, notify-send -u low "$(omarchy-battery-status)"
bindd = $CMD CTRL ALT, W, Show weather, exec, notify-send -u low "$(omarchy-weather-status)"

# Control panels
bindd = $CMD CTRL, A, Audio controls, exec, omarchy-launch-audio
bindd = $CMD CTRL, B, Bluetooth controls, exec, omarchy-launch-bluetooth
bindd = $CMD CTRL, W, Wifi controls, exec, omarchy-launch-wifi
bindd = $CMD CTRL, T, Activity, exec, omarchy-launch-tui btop

# Dictation
bindd  = $CMD CTRL, X, Toggle dictation, exec, voxtype record toggle

# Lock system
bindd = $CMD CTRL, L, Lock system, exec, omarchy-system-lock
bindd = , PAUSE, Lock Screen, exec, omarchy-system-lock

# Toggle Language Input
bindd = , Hiragana_Katakana, IME, exec, omarchy-toggle-language
