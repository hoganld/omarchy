bind = $CMD, K, exec, :
bind = $CMD, L, exec, :
bind = $CMD, M, exec, :
bind = $CMD, N, exec, :
bind = $CMD, O, exec, :
bind = $CMD, P, exec, :
bind = $CMD, Q, exec, :
bind = $CMD, R, exec, :
bind = $CMD, S, exec, :
bind = $CMD, T, exec, :
bind = $CMD, U, exec, :
bind = $CMD, V, exec, :
bind = $CMD, W, exec, :
bind = $CMD, X, exec, :
bind = $CMD, Y, exec, :
bind = $CMD, Z, exec, :
bind = $CMD, space, exec, :
