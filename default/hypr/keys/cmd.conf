# Handle the Command key
# Command is a custom modifier, so we have to make sure that it is ignored when not explicitly bound, so that these keypresses are not passed through to applications. (Any other keybindings using these keys will still be honored by Hyprland.)

# === Ignore standalone CMD key presses (F24) ===
bindd = , F24, No-Op, exec, :

# === Ignore all CMD-* keys by default ===
## Alphabet
bind = $CMD, A, exec, :
bind = $CMD, B, exec, :
bind = $CMD, C, exec, :
bind = $CMD, D, exec, :
bind = $CMD, E, exec, :
