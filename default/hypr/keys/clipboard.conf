# Copy / Paste
bindd = $CMD, C, Universal copy, sendshortcut, CTRL, Insert, activewindow
bindd = $CMD, V, Universal paste, sendshortcut, SHIFT, Insert, activewindow
bindd = $CMD, X, Universal cut, sendshortcut, CTRL, X, activewindow
bindd = $CMD CTRL, V, Clipboard manager, exec, omarchy-launch-walker -m clipboard
